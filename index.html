<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios de JavaScript - Portafolio</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }

    .card-item a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-item a span {
      background: #e0e7ff;
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Práctica de JavaScript</h1>
  </header>

  <div class="card-list">
    <div class="card-item">
      <a href="./ejercicio1/index.html"><span>01</span> Calculadora de compra</a>
    </div>
    <div class="card-item">
      <a href="./ejercicio2/index.html"><span>02</span> Verificador de contraseña</a>
    </div>
    <div class="card-item">
      <a href="./ejercicio3/index.html"><span>03</span> Analizador de calificaciones</a>
    </div>
    <div class="card-item">
      <a href="./ejercicio4/index.html"><span>04</span> Lista interactiva de tareas</a>
    </div>
  </div>
</body>
</html>
