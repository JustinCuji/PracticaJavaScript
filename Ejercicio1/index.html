<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 1 - Calculadora de compra</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h2>Calculadora de compra</h2>
  <label for="precio">Precio unitario ($):</label>
  <input type="number" id="precio" step="0.01" placeholder="Ej. 12.50">

  <label for="cantidad">Cantidad:</label>
  <input type="number" id="cantidad" placeholder="Ej. 3">

  <button onclick="calcularTotal()">Calcular total</button>

  <div id="mensaje-error" class="error"></div>
  <div id="resultado" class="resultado"></div>

  <p><a href="../index.html">← Volver al menú principal</a></p>
  <script src="script.js"></script>
</body>
</html>
